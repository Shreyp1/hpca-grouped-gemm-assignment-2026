<text x="679" y="707" fill="#26334b" font-size="22" font-weight="400" text-anchor="start" >The inner dimension K and output dimension N are the same for all groups.</text>
<text x="67" y="774" fill="#35415b" font-size="25" font-weight="700" text-anchor="start" >General case:</text>
<rect x="257" y="740" width="817" height="49" rx="13" fill="#f3f7fc" stroke="#d5e1ee" stroke-width="1.8" />
<text x="277" y="771" fill="#344057" font-size="23" font-weight="600" text-anchor="start" >Y<tspan font-size="16.1" baseline-shift="sub">g</tspan> [M<tspan font-size="16.1" baseline-shift="sub">g</tspan>, N] = ReLU( X<tspan font-size="16.1" baseline-shift="sub">g</tspan> [M<tspan font-size="16.1" baseline-shift="sub">g</tspan>, K] × W<tspan font-size="16.1" baseline-shift="sub">g</tspan> [K, N] + b<tspan font-size="16.1" baseline-shift="sub">g</tspan> [N] ),     0 ≤ g &lt; G</text>
