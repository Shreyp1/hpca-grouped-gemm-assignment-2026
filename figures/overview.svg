<svg xmlns="http://www.w3.org/2000/svg" width="1836" height="857" viewBox="0 0 1836 857" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">One operation, many independent matrix multiplications</title>
<desc id="svgdesc">Three independent grouped GEMM examples. Each group has its own X, W, bias and Y. The number of rows M varies between groups, while K and N are common. The outputs are computed as ReLU(X times W plus bias).</desc>
