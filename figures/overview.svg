<text x="679" y="678" fill="#26334b" font-size="22" font-weight="400" text-anchor="start" >Only the row count M<tspan font-size="15.4" baseline-shift="sub">g</tspan> varies across groups (e.g., M<tspan font-size="15.4" baseline-shift="sub">0</tspan> = 2, M<tspan font-size="15.4" baseline-shift="sub">1</tspan> = 1, M<tspan font-size="15.4" baseline-shift="sub">2</tspan> = 3).</text>
